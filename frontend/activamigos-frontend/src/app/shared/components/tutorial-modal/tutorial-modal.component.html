<div *ngIf="isOpen" class="fixed inset-0 z-50 bg-white flex flex-col animate-fade-in tutorial-screen">
  <div class="flex-1 flex flex-col w-full max-w-2xl mx-auto bg-white">
    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between gap-4 bg-white sticky top-0 z-10">
      <div>
        <p class="text-xs font-bold text-indigo-500 uppercase tracking-[0.22em]">Tutorial</p>
        <h2 class="text-xl font-bold text-gray-900 mt-1">Descubre ActivAmigos paso a paso</h2>
      </div>
      <button
        (click)="closeModal()"
        class="text-3xl p-3 min-w-[48px] min-h-[48px] flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors"
        aria-label="Cerrar tutorial">
        ⬅️
      </button>
    </div>

    <div class="flex-1 overflow-y-auto">
      <div class="px-6 py-8 min-h-full flex flex-col justify-center">
        <div class="w-32 h-32 mx-auto rounded-full flex items-center justify-center text-6xl mb-8 shadow-sm border-4 border-white transition-all duration-500 transform"
             [ngClass]="slides[currentSlide].color">
          {{ slides[currentSlide].image }}
        </div>

        <h2 class="text-3xl md:text-4xl font-black text-gray-800 mb-4 leading-tight text-center">
          {{ slides[currentSlide].title }}
        </h2>

        <p class="text-xl text-gray-500 font-medium leading-relaxed max-w-md mx-auto text-center">
          {{ slides[currentSlide].text }}
        </p>
      </div>
    </div>

    <div class="px-6 py-6 border-t border-gray-100 bg-white space-y-5">
      <div class="flex justify-center gap-2">
        <button *ngFor="let slide of slides; let i = index"
                (click)="goToSlide(i)"
                class="w-3 h-3 rounded-full transition-all duration-300"
                [ngClass]="i === currentSlide ? 'bg-indigo-600 scale-125' : 'bg-gray-300 hover:bg-gray-400'">
        </button>
      </div>

      <div class="flex gap-4">
        <button *ngIf="currentSlide > 0"
                (click)="prevSlide()"
                class="flex-1 py-4 bg-white border-2 border-gray-200 text-gray-600 rounded-2xl font-bold text-lg hover:bg-gray-50 transition-colors">
          ⬅️ Anterior
        </button>

        <button (click)="nextSlide()"
                class="flex-1 py-4 bg-indigo-600 text-white rounded-2xl font-bold text-lg shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all flex items-center justify-center gap-2">
          <span>{{ currentSlide === slides.length - 1 ? '¡Entendido!' : 'Siguiente' }}</span>
          <span *ngIf="currentSlide !== slides.length - 1">→</span>
          <span *ngIf="currentSlide === slides.length - 1">🎉</span>
        </button>
      </div>
    </div>
  </div>
</div>

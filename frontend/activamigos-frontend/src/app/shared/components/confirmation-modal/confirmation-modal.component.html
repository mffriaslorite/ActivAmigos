<div *ngIf="isOpen" 
     class="fixed inset-0 bg-white flex flex-col items-center justify-center z-50 p-6 animate-fade-in"
     (click)="onBackdropClick($event)">
  
  <div class="w-full max-w-md flex flex-col items-center"
       (click)="$event.stopPropagation()">
    
    <div class="text-center w-full">
      <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full mb-4"
           [ngClass]="{
             'bg-red-100 text-red-600': type === 'danger',
             'bg-yellow-100 text-yellow-600': type === 'warning',
             'bg-blue-100 text-blue-600': type === 'info'
           }">
        <span class="text-2xl" *ngIf="type === 'danger'">⚠️</span>
        <span class="text-2xl" *ngIf="type === 'warning'">🤔</span>
        <span class="text-2xl" *ngIf="type === 'info'">ℹ️</span>
      </div>

      <h3 class="text-lg font-bold text-gray-900 mb-2">{{ title }}</h3>
      <p class="text-sm text-gray-500 mb-6 leading-relaxed">{{ message }}</p>

      <div class="flex flex-col gap-3 w-full">
        <button *ngIf="type === 'info'"
                (click)="cancel.emit()"
                class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-all active:scale-95 shadow-lg">
          Entendido
        </button>

        <ng-container *ngIf="type !== 'info'">
          <button (click)="confirm.emit()"
                  [disabled]="isLoading"
                  class="w-full py-4 text-white font-bold rounded-xl shadow-lg transition-all flex justify-center items-center gap-2 active:scale-95 text-lg"
                  [ngClass]="type === 'danger' ? 'bg-red-500 hover:bg-red-600' : 'bg-yellow-500 hover:bg-yellow-600'">
            <span *ngIf="isLoading" class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            <span *ngIf="!isLoading">{{ confirmText }}</span>
          </button>

          <button (click)="cancel.emit()"
                  [disabled]="isLoading"
                  class="w-full py-4 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition-all active:scale-95 text-lg disabled:opacity-50">
            {{ cancelText }}
          </button>
        </ng-container>
      </div>
    </div>
  </div>
</div>

<div *ngIf="isVisible" 
     class="fixed inset-0 bg-white z-50 flex flex-col animate-fade-in"
     (click)="onBackdropClick($event)">
  
  <div class="flex-1 flex flex-col w-full max-w-2xl mx-auto container shadow-sm bg-white"
       (click)="$event.stopPropagation()">

    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-white sticky top-0 z-10">
      <div>
        <h2 class="text-xl font-bold text-gray-900 mt-2">
          {{ currentStep === 1 ? 'Nueva Actividad' : 'Añadir Normas' }}
        </h2>
        <p class="text-xs text-gray-500 mt-1">Paso {{ currentStep }} de 2</p>
      </div>
      <button (click)="closeModal()" [disabled]="isSubmitting" class="text-3xl mb-4 p-3 min-w-[48px] min-h-[48px] flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors">
        ✕
      </button>
    </div>
    
    <div class="flex-1 overflow-y-auto w-full">
      <div class="p-6">
      
      <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg flex items-center gap-2">
        <span>⚠️</span> {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="mb-4 p-3 bg-green-50 text-green-700 text-sm rounded-lg flex items-center gap-2 justify-center font-bold">
        <span>✅</span> {{ successMessage }}
      </div>

      <form *ngIf="currentStep === 1 && !successMessage" [formGroup]="activityForm" (ngSubmit)="nextStep()">
        
        <div class="space-y-3">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Título</label>
            <input type="text" formControlName="title" 
                   class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none"
                   [class.border-red-300]="isFieldInvalid('title')"
                   placeholder="Ej: Paseo por el parque">
            <p *ngIf="isFieldInvalid('title')" class="text-xs text-red-500 mt-1">Escribe un título corto.</p>
          </div>

          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Tipo de Actividad</label>
            <div class="grid grid-cols-2 gap-2 sm:grid-cols-3">
              <button type="button" 
                      *ngFor="let type of activityTypes" 
                      (click)="selectActivityType(type.value)"
                      class="flex items-center gap-2 px-4 py-2.5 rounded-full border transition-all"
                      [ngClass]="activityForm.get('activity_type')?.value === type.value 
                        ? 'border-blue-500 bg-blue-50 text-blue-700 shadow-sm ring-1 ring-blue-500' 
                        : 'border-gray-200 bg-white text-gray-600 hover:border-blue-300 hover:bg-gray-50'">
                <span class="text-xl">{{ type.icon }}</span>
                <span class="text-sm font-bold whitespace-nowrap">{{ type.label }}</span>
              </button>
            </div>
            <p *ngIf="isFieldInvalid('activity_type')" class="text-xs text-red-500 mt-1">Debes elegir un tipo.</p>
          </div>

          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">¿Cuándo?</label>
            <input type="datetime-local" formControlName="date"
                   class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none">
          </div>

          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">¿Dónde? <span class="font-normal text-gray-400">(Opcional)</span></label>
            <input type="text" formControlName="location"
                   class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none"
                   placeholder="Ej: Entrada del Retiro">
          </div>

          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Detalles <span class="font-normal text-gray-400">(Opcional)</span></label>
            <textarea formControlName="description" rows="2"
                      class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none resize-none"
                      placeholder="¿Qué vamos a hacer?"></textarea>
          </div>
        </div>

        <div class="mt-6">
          <button type="submit" 
                  class="w-full py-3 bg-blue-600 text-white rounded-xl font-bold shadow-md hover:bg-blue-700 active:scale-95 transition-all flex justify-center items-center gap-2">
            <span>Siguiente ➡️</span>
          </button>
        </div>
      </form>

      <div *ngIf="currentStep === 2 && !successMessage" class="h-full flex flex-col min-h-[400px]">
        
        <div class="flex-1 -mx-6 -my-6"> 
          <app-rules-selector
             [contextType]="'ACTIVITY'"
             [contextId]="0"
             [preselectedRuleIds]="selectedRuleIds"
             (cancel)="onRulesCancel()"
             (save)="onRulesSave($event)">
           </app-rules-selector>
        </div>
        
      </div>

    </div>
  </div>
</div>

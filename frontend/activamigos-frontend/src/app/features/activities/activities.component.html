<div class="min-h-screen bg-gray-50 flex flex-col pb-20"> <header class="bg-white px-6 py-4 border-b border-gray-200 sticky top-0 z-10">
      <div class="flex items-center gap-4 max-w-2xl mx-auto w-full">
        <button (click)="goBack()" class="p-2 -ml-2 hover:bg-gray-100 rounded-full transition-colors text-2xl">
          ⬅️
        </button>
        <h1 class="text-2xl font-bold text-gray-900">Actividades</h1>
      </div>
    </header>

    <main class="flex-1 px-4 py-6 w-full max-w-2xl mx-auto space-y-6">
      
      <div class="relative">
        <input 
          type="text" 
          placeholder="Buscar planes divertidos..."
          (input)="onSearch($event)"
          [value]="searchTerm"
          class="w-full px-5 py-3 pl-12 bg-white rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition-all text-lg"
        >
        <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-2xl">🔍</span>
      </div>

      <section class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="p-4 flex items-center justify-between gap-3">
          <button
            type="button"
            (click)="toggleFilters()"
            class="flex-1 flex items-center justify-between gap-3 text-left hover:bg-gray-50 transition-colors rounded-xl p-1 -m-1"
            [attr.aria-expanded]="showFilters">
            <div class="flex items-center gap-3 min-w-0">
              <span class="text-2xl">🧭</span>
              <div class="min-w-0">
                <h2 class="font-bold text-gray-800">Filtrar actividades</h2>
                <p class="text-sm text-gray-500" *ngIf="!hasActiveFilters">Pulsa para ver los filtros</p>
                <p class="text-sm text-gray-500 flex items-center gap-2 flex-wrap" *ngIf="hasActiveFilters">
                  <span *ngIf="selectedTypeOption" class="inline-flex items-center gap-1">
                    {{ selectedTypeOption.icon }} {{ selectedTypeOption.label }}
                  </span>
                  <span *ngIf="selectedGroupOption" class="inline-flex items-center gap-1">
                    👥 {{ selectedGroupOption.name }}
                  </span>
                  <span *ngIf="selectedDate" class="inline-flex items-center gap-1">
                    📅 {{ formattedSelectedDate }}
                  </span>
                </p>
              </div>
            </div>
            <span class="text-xl text-gray-500 flex-shrink-0">{{ showFilters ? '▴' : '▾' }}</span>
          </button>

          <button
            *ngIf="searchTerm || selectedType || selectedDate || selectedGroupId"
            type="button"
            (click)="clearFilters()"
            class="text-sm font-bold text-red-600 border border-red-200 rounded-full px-3 py-1.5 hover:bg-red-50 transition-colors flex-shrink-0">
            Limpiar
          </button>
        </div>

        <div *ngIf="showFilters" class="border-t border-gray-100 p-4 space-y-4 animate-fade-in">
          <div>
            <p class="text-sm font-bold text-gray-700 mb-2">Tipo</p>
            <div class="flex flex-wrap gap-2">
              <button
                *ngFor="let option of activityTypeOptions"
                type="button"
                (click)="onTypeFilterChange(option.value)"
                class="px-4 py-2 rounded-full border text-sm font-bold transition-colors inline-flex items-center gap-2"
                [ngClass]="selectedType === option.value ? 'bg-blue-600 text-white border-blue-600' : 'bg-gray-50 text-gray-700 border-gray-200 hover:border-blue-300 hover:bg-blue-50'">
                <span>{{ option.icon }}</span>
                <span>{{ option.label }}</span>
              </button>
            </div>
          </div>

          <div>
            <label for="activity-date-filter" class="block text-sm font-bold text-gray-700 mb-2">Fecha</label>
            <input
              id="activity-date-filter"
              type="date"
              [value]="selectedDate"
              (input)="onDateFilterChange($event)"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
          </div>

          <div *ngIf="groupFilterOptions.length > 0">
            <label for="activity-group-filter" class="block text-sm font-bold text-gray-700 mb-2">Grupo</label>
            <div class="group-filter-summary">
              <button
                id="activity-group-filter"
                type="button"
                class="group-filter-summary__button"
                (click)="openGroupPicker()"
                [attr.aria-label]="'Elegir grupo. Ahora: ' + groupFilterSummary">
                <span class="group-filter-summary__leading">👥</span>
                <span class="group-filter-summary__copy">
                  <span class="group-filter-summary__eyebrow">Actividad asociada a</span>
                  <span class="group-filter-summary__value">{{ groupFilterSummary }}</span>
                </span>
                <span class="group-filter-summary__chevron" aria-hidden="true">▾</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <div *ngIf="errorMessage" class="bg-red-50 p-4 rounded-xl text-red-700 flex items-center justify-between">
        <span>{{ errorMessage }}</span>
        <button (click)="loadActivities()" class="underline font-bold">Reintentar</button>
      </div>

      <div *ngIf="isLoading && activities.length === 0" class="space-y-4">
        <div class="bg-white h-24 rounded-2xl animate-pulse"></div>
        <div class="bg-white h-24 rounded-2xl animate-pulse"></div>
        <div class="bg-white h-24 rounded-2xl animate-pulse"></div>
      </div>

      <div *ngIf="!isLoading || activities.length > 0">
        
        <section *ngIf="getMyActivities().length > 0" class="mb-8 animate-fade-in">
          <h2 class="font-bold text-gray-800 text-lg mb-3 flex items-center gap-2">
            <span>📅</span> Mis Planes
          </h2>
          <div class="flex flex-col gap-4">
            <app-activity-card
              *ngFor="let activity of getMyActivities(); trackBy: trackByActivityId"
              [activity]="activity"
              [isLoading]="isActivityLoading(activity.id)"
              (joinActivity)="onJoinActivity($event)"
              (leaveActivity)="onLeaveActivityClick($event)" 
            ></app-activity-card>
        </div>
        </section>

        <section *ngIf="getAvailableActivities().length > 0" class="animate-fade-in">
          <h2 class="font-bold text-gray-800 text-lg mb-3 flex items-center gap-2">
            <span>🌟</span> Descubrir
          </h2>
          <div class="flex flex-col gap-3">
            <app-activity-card
              *ngFor="let activity of getAvailableActivities(); trackBy: trackByActivityId"
              [activity]="activity"
              [isLoading]="isActivityLoading(activity.id)"
              (joinActivity)="onJoinActivity($event)">
            </app-activity-card>
          </div>
        </section>

        <div *ngIf="filteredActivities.length === 0 && !isLoading && !errorMessage" class="text-center py-12 text-gray-400">
          <div class="text-5xl mb-3">🤔</div>
          <p class="text-lg">No encontramos actividades con esos filtros.</p>
          <button (click)="createActivity()" class="mt-4 text-blue-600 font-bold underline">
            ¿Creas una actividad tú?
          </button>
        </div>

      </div>
    </main>

    <button (click)="createActivity()" 
            class="fixed bottom-24 right-6 w-16 h-16 bg-blue-600 text-white rounded-full shadow-lg hover:shadow-xl hover:bg-blue-700 active:scale-95 transition-all flex items-center justify-center text-4xl pb-1 z-20"
            aria-label="Crear actividad">
      +
    </button>

    <app-create-activity-modal
      [isVisible]="showCreateModal"
      (close)="onCreateModalClose()"
      (activityCreated)="onActivityCreated()">
    </app-create-activity-modal>

    <app-confirmation-modal
      [isOpen]="showLeaveModal"
      [title]="leaveModalConfig.title"
      [message]="leaveModalConfig.message"
      [type]="leaveModalConfig.type"
      [confirmText]="leaveModalConfig.confirmText"
      [isLoading]="isActivityLoading(activityToLeave?.id || 0)"
      (confirm)="confirmLeave()"
      (cancel)="cancelLeave()">
    </app-confirmation-modal>

    <div *ngIf="showGroupPicker" class="group-picker-overlay" (click)="closeGroupPicker()">
      <div class="group-picker-sheet" (click)="$event.stopPropagation()">
        <div class="group-picker-sheet__header">
          <div>
            <p class="group-picker-sheet__eyebrow">Filtro de grupo</p>
            <h3 class="group-picker-sheet__title">Elige un grupo</h3>
          </div>
          <button type="button" class="group-picker-sheet__close" (click)="closeGroupPicker()" aria-label="Cerrar selector de grupos">
            ✕
          </button>
        </div>

        <div class="group-picker-search">
          <span class="group-picker-search__icon" aria-hidden="true">🔍</span>
          <input
            type="text"
            [value]="groupSearchTerm"
            (input)="onGroupSearch($event)"
            class="group-picker-search__input"
            placeholder="Buscar grupo..."
            aria-label="Buscar grupo">
        </div>

        <div class="group-picker-sheet__options" role="listbox" aria-label="Grupos disponibles">
          <button
            type="button"
            class="group-picker-option"
            [class.group-picker-option--selected]="selectedGroupId === ''"
            (click)="selectGroupFilter('')">
            <span class="group-picker-option__icon">🌍</span>
            <span class="group-picker-option__copy">
              <span class="group-picker-option__title">Todos los grupos</span>
              <span class="group-picker-option__hint">Muestra cualquier actividad.</span>
            </span>
            <span *ngIf="selectedGroupId === ''" class="group-picker-option__check">✓</span>
          </button>

          <div *ngIf="myFilteredGroupOptions.length > 0" class="group-picker-section">
            <p class="group-picker-section__title">Mis grupos</p>
            <button
              *ngFor="let group of myFilteredGroupOptions"
              type="button"
              class="group-picker-option"
              [class.group-picker-option--selected]="selectedGroupId === getGroupIdValue(group)"
              (click)="selectGroupFilter(getGroupIdValue(group))">
              <span class="group-picker-option__icon">👥</span>
              <span class="group-picker-option__copy">
                <span class="group-picker-option__title">{{ group.name }}</span>
                <span class="group-picker-option__hint">Solo actividades asociadas a este grupo.</span>
              </span>
              <span *ngIf="selectedGroupId === getGroupIdValue(group)" class="group-picker-option__check">✓</span>
            </button>
          </div>

          <div *ngIf="otherFilteredGroupOptions.length > 0" class="group-picker-section">
            <p class="group-picker-section__title">Otros grupos</p>
            <button
              *ngFor="let group of otherFilteredGroupOptions"
              type="button"
              class="group-picker-option"
              [class.group-picker-option--selected]="selectedGroupId === getGroupIdValue(group)"
              (click)="selectGroupFilter(getGroupIdValue(group))">
              <span class="group-picker-option__icon">👥</span>
              <span class="group-picker-option__copy">
                <span class="group-picker-option__title">{{ group.name }}</span>
                <span class="group-picker-option__hint">Solo actividades asociadas a este grupo.</span>
              </span>
              <span *ngIf="selectedGroupId === getGroupIdValue(group)" class="group-picker-option__check">✓</span>
            </button>
          </div>

          <div *ngIf="filteredGroupFilterOptions.length === 0" class="group-picker-empty">
            <div class="group-picker-empty__icon">🤔</div>
            <p class="group-picker-empty__title">No hemos encontrado ese grupo</p>
            <p class="group-picker-empty__hint">Prueba con otro nombre o borra la búsqueda.</p>
          </div>
        </div>
      </div>
    </div>

    <app-bottom-nav></app-bottom-nav>
</div>

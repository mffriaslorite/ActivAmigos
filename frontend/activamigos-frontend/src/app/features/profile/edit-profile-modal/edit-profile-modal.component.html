<div class="fixed inset-0 bg-white z-50 flex flex-col animate-fade-in" *ngIf="isVisible">
    
    <div class="flex-1 flex flex-col w-full max-w-2xl mx-auto container shadow-sm bg-white" (click)="$event.stopPropagation()">
        
        <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between sticky top-0 bg-white z-10">
            <h2 class="text-xl font-bold text-gray-900 mt-2">Editar Perfil</h2>
            <button class="text-3xl mb-4 p-3 min-w-[48px] min-h-[48px] flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors" (click)="closeModal()">⬅️</button>
        </div>

        <div class="flex-1 overflow-y-auto w-full profile-edit-scroll">
            <div class="p-6 pb-32">
            
            <div class="flex flex-col items-center mb-8">
                <div class="relative group cursor-pointer" (click)="triggerFileInput()">
                    <div class="w-28 h-28 bg-indigo-50 rounded-full flex items-center justify-center overflow-hidden border-4 border-white shadow-lg">
                        <img *ngIf="getProfileImageUrl()" [src]="getProfileImageUrl()" alt="Profile" class="w-full h-full object-cover">
                        <span *ngIf="!getProfileImageUrl()" class="text-4xl">👤</span>
                    </div>
                    
                    <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <span class="text-2xl">📷</span>
                    </div>
                    
                    <div class="absolute bottom-0 right-0 bg-indigo-600 text-white rounded-full w-8 h-8 flex items-center justify-center border-2 border-white shadow-sm">
                        <span class="text-xs">✏️</span>
                    </div>
                </div>

                <input #fileInput type="file" class="hidden" accept="image/*" (change)="onImageSelected($event)">
                
                <div class="mt-4 flex gap-3" *ngIf="getProfileImageUrl()">
                    <button type="button" 
                            class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition-colors"
                            (click)="triggerFileInput()"
                            [disabled]="isUploading">
                        {{ isUploading ? 'Subiendo...' : 'Cambiar foto' }}
                    </button>
                    <button type="button" 
                            class="text-xs font-bold text-red-500 bg-red-50 px-3 py-1.5 rounded-lg hover:bg-red-100 transition-colors flex items-center gap-1"
                            (click)="onDeleteImage()"
                            [disabled]="isUploading || isLoading">
                        <span>🗑️</span> Eliminar
                    </button>
                </div>
            </div>

            <form id="edit-profile-form" [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-5">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Nombre</label>
                        <input type="text" formControlName="first_name" class="input-field" placeholder="Tu nombre">
                        <p *ngIf="profileForm.get('first_name')?.invalid && profileForm.get('first_name')?.touched" class="text-xs text-red-500 mt-1 pl-1">Campo requerido</p>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Apellido</label>
                        <input type="text" formControlName="last_name" class="input-field" placeholder="Tu apellido">
                        <p *ngIf="profileForm.get('last_name')?.invalid && profileForm.get('last_name')?.touched" class="text-xs text-red-500 mt-1 pl-1">Campo requerido</p>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Biografía</label>
                    <textarea formControlName="bio" rows="3" class="input-field resize-none" placeholder="Cuéntanos algo sobre ti..." maxlength="500"></textarea>
                    <div class="flex justify-between mt-1 px-1">
                        <p *ngIf="profileForm.get('bio')?.invalid" class="text-xs text-red-500">Máximo 500 caracteres</p>
                        <span class="text-xs text-gray-400 ml-auto">{{ profileForm.get('bio')?.value?.length || 0 }}/500</span>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Mostrar mis puntos</label>
                    <p class="text-xs text-gray-500 mb-3">Elige la forma que te resulte más fácil de entender.</p>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button"
                                (click)="profileForm.patchValue({ points_display_mode: 'XP' })"
                                class="rounded-2xl border px-4 py-4 text-left transition-all"
                                [ngClass]="profileForm.get('points_display_mode')?.value === 'XP'
                                  ? 'border-indigo-500 bg-indigo-50 text-indigo-700 shadow-sm'
                                  : 'border-gray-200 bg-white text-gray-600 hover:border-indigo-300'">
                            <p class="font-bold">🔢 Números</p>
                            <p class="mt-1 text-xs">Ver puntos como 50 XP.</p>
                        </button>
                        <button type="button"
                                (click)="profileForm.patchValue({ points_display_mode: 'STARS' })"
                                class="rounded-2xl border px-4 py-4 text-left transition-all"
                                [ngClass]="profileForm.get('points_display_mode')?.value === 'STARS'
                                  ? 'border-indigo-500 bg-indigo-50 text-indigo-700 shadow-sm'
                                  : 'border-gray-200 bg-white text-gray-600 hover:border-indigo-300'">
                            <p class="font-bold">⭐ Estrellas</p>
                            <p class="mt-1 text-xs">Ver el progreso con estrellas.</p>
                        </button>
                    </div>
                </div>

                <div *ngIf="errorMessage" class="bg-red-50 text-red-600 p-3 rounded-xl text-sm font-medium flex items-center gap-2 animate-fade-in">
                    <span>⚠️</span> {{ errorMessage }}
                </div>
                <div *ngIf="successMessage" class="bg-green-50 text-green-700 p-3 rounded-xl text-sm font-medium flex items-center gap-2 animate-fade-in">
                    <span>✅</span> {{ successMessage }}
                </div>

            </form>
        </div>
      </div>

      <div class="profile-edit-actions px-6 py-4 border-t border-gray-100 bg-white">
        <div class="flex gap-3">
          <button type="button" 
                  class="flex-1 py-3 px-4 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition-colors flex justify-center items-center gap-2"
                  (click)="closeModal()" 
                  [disabled]="isLoading || isUploading">
              <span>❌</span> Cancelar
          </button>
          <button type="submit"
                  form="edit-profile-form"
                  class="flex-[2] py-3 px-4 bg-indigo-600 text-white font-bold rounded-xl shadow-lg hover:bg-indigo-700 active:scale-95 transition-all disabled:opacity-50 disabled:scale-100 flex justify-center items-center gap-2"
                  [disabled]="isLoading || isUploading || profileForm.invalid">
              <span *ngIf="!isLoading">💾 Guardar Cambios</span>
              <span *ngIf="isLoading" class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          </button>
        </div>
      </div>
    </div>

    <app-confirmation-modal
      [isOpen]="showDeleteConfirmation"
      title="¿Eliminar foto?"
      message="¿Estás seguro de que quieres eliminar tu foto de perfil? Volverás a tener el avatar por defecto."
      confirmText="Sí, eliminar"
      cancelText="Cancelar"
      type="danger"
      [isLoading]="isDeleting"
      (confirm)="onConfirmDelete()"
      (cancel)="showDeleteConfirmation = false">
    </app-confirmation-modal>

</div>

<div class="fixed inset-0 bg-white z-50 flex flex-col animate-fade-in" *ngIf="isVisible">
    
    <div class="flex-1 flex flex-col w-full max-w-2xl mx-auto container shadow-sm bg-white">
        
        <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-white sticky top-0 z-10">
            <h2 class="text-xl font-bold text-gray-900 mt-2">Cambiar contraseña</h2>
            <button class="text-3xl mb-4 p-3 min-w-[48px] min-h-[48px] flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors" (click)="closeModal()">⬅️</button>
        </div>

        <div class="flex-1 overflow-y-auto w-full">
            <div class="p-6">
            <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="space-y-4">
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Contraseña Actual</label>
                    <div class="relative">
                        <input [type]="showCurrentPassword ? 'text' : 'password'" 
                               formControlName="current_password" 
                               class="input-field pr-10" 
                               placeholder="••••••••">
                        <button type="button" class="absolute right-3 top-3 text-gray-400 hover:text-indigo-600" (click)="showCurrentPassword = !showCurrentPassword">
                            {{ showCurrentPassword ? '🙈' : '👁️' }}
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Nueva Contraseña</label>
                    <div class="relative">
                        <input [type]="showNewPassword ? 'text' : 'password'" 
                               formControlName="new_password" 
                               class="input-field pr-10" 
                               placeholder="Tu nueva contraseña">
                        <button type="button" class="absolute right-3 top-3 text-gray-400 hover:text-indigo-600" (click)="showNewPassword = !showNewPassword">
                            {{ showNewPassword ? '🙈' : '👁️' }}
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Repetir Nueva</label>
                    <div class="relative">
                        <input [type]="showConfirmPassword ? 'text' : 'password'" 
                               formControlName="confirm_password" 
                               class="input-field pr-10" 
                               placeholder="Confírmala">
                        <button type="button" class="absolute right-3 top-3 text-gray-400 hover:text-indigo-600" (click)="showConfirmPassword = !showConfirmPassword">
                            {{ showConfirmPassword ? '🙈' : '👁️' }}
                        </button>
                    </div>
                    <p *ngIf="passwordForm.errors?.['passwordMismatch'] && passwordForm.get('confirm_password')?.touched" class="text-red-500 text-xs mt-1 font-bold pl-1">
                        Las contraseñas no coinciden
                    </p>
                </div>

                <div *ngIf="animalsList.length > 0" class="bg-blue-50 p-4 rounded-2xl border border-blue-100 mt-2">
                    <p class="text-xs text-blue-800 font-bold mb-2 flex items-center gap-1 uppercase tracking-wide">
                        <span class="text-base">💡</span> Tu pista de seguridad
                    </p>
                    <p class="text-xs text-blue-600/80 mb-3 leading-relaxed">
                        Estos son tus animales secretos para recuperar la cuenta:
                    </p>
                    <div class="flex flex-wrap gap-2">
                        <span *ngFor="let animal of animalsList" 
                              class="bg-white px-3 py-1.5 rounded-lg text-xs text-blue-700 border border-blue-100 shadow-sm font-bold">
                            {{ animal }}
                        </span>
                    </div>
                </div>

                <div *ngIf="errorMessage" class="bg-red-50 text-red-600 p-3 rounded-xl text-sm font-medium">⚠️ {{ errorMessage }}</div>
                <div *ngIf="successMessage" class="bg-green-50 text-green-700 p-3 rounded-xl text-sm font-medium">✅ {{ successMessage }}</div>

                <div class="pt-2 flex gap-3">
                    <button type="button" (click)="closeModal()" class="flex-1 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200 transition-colors flex justify-center items-center gap-2">
                        <span>❌</span> Cancelar
                    </button>
                    <button type="submit" [disabled]="isLoading || passwordForm.invalid" class="flex-[2] py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all disabled:opacity-50 flex justify-center items-center gap-2">
                        <span *ngIf="!isLoading">🔑 Cambiar Contraseña</span>
                        <span *ngIf="isLoading">...</span>
                    </button>
                </div>
            </form>
        </div>
      </div>
    </div>
</div>
